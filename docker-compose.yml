services:
  # --- PostgreSQL + PostGIS ---
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiber_forecast}
      POSTGRES_USER: ${POSTGRES_USER:-broadband}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broadband_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-broadband} -d ${POSTGRES_DB:-fiber_forecast}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- FastAPI Backend ---
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-broadband}:${POSTGRES_PASSWORD:-broadband_secret}@db:5432/${POSTGRES_DB:-fiber_forecast}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- React Frontend (nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_FRONTEND_FORGE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
